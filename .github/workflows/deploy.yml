name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 146.56.250.72
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /data/saulyue-hub
            git pull origin main
            docker compose up -d --build
